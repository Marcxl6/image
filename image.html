<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Generator</title>
    <link rel="stylesheet" href="image.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Image Generator</h1>
            <p>Masukkan deskripsi dan buat gambar sesuai imajinasi Anda!</p>
        </header>

        <section class="form-section">
            <input type="text" id="description" placeholder="Masukkan deskripsi gambar..." />
            <button id="generateBtn">Generate Gambar</button>
        </section>

        <section class="image-section">
            <h2>Hasil Gambar:</h2>
            <div id="imageResult" class="image-result">
                <!-- Gambar yang dihasilkan akan ditampilkan di sini -->
            </div>
        </section>
    </div>

    <script src="image.js"></script>
</body>
</html>
